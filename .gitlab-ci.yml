include:
  - project: rayprosoft/tgs-ci-scripts
    ref: main
    file: GitLab/Templates/gitlab-job-templates.yml

variables:
  ImageName: pgtgs/payment-gc
  TgsSettingKey: payment-gcpay
  HelmTemplateFolderName: gc-pay
  BuildCacheKey: Tgs.GCPay.$CI_PIPELINE_IID

stages:
  - build
  - test
  - publish
  - deploy-dev
  - deploy-staging
  - deploy-prod

build-code:
  extends: .build-code-template

unit-test:
  extends: .unit-test-template
  variables:
    Framework: net7.0

push-nuget:
  extends: .push-nuget-template
  script:
    - push_package 'GCPay.Client'
  artifacts:
    paths:
      - GCPay.Client/bin/$BuildConfiguration/*.nupkg

push-docker-image:
  extends: .push-docker-image-template
  script:
    - push_docker 'Tgs.Payment.GCPay/Tgs.Payment.GCPay.csproj' $ImageName $Tag

push-k8s-template:
  extends: .push-k8s-template
  script:
    - push_k8s_template $HelmTemplateFolderName $ImageName $Tag

deploy-dev:
  extends: .deploy-template
  variables:
    namespace: dev
    kube_config: KubeConfig_Raypro_dev
  environment:
    name: dev
  stage: deploy-dev
  needs:
    - push-nuget
    - push-docker-image
    - job: push-k8s-template
      artifacts: true
  only:
    - main
  script:
    - deploy_k8s $TgsSettingKey $HelmTemplateFolderName $namespace
    - |
      cat << EOF | name_template="tgs-hpay" deploy_k8s $TgsSettingKey $HelmTemplateFolderName $namespace
        {
          "podServiceName": "Payment-HPay",
          "podEnv": [
            {
              "name": "ConnectionStrings__Nats",
              "valueFrom": {
                "secretKeyRef": {
                  "name": "tgs-connections",
                  "key": "nats"
                }
              }
            },
            {
              "name": "GCPay__PaymentApiUrl",
              "valueFrom": {
                "secretKeyRef": {
                  "name": "tgs-connections",
                  "key": "payment-hpay-paymentApiUrl"
                }
              }
            },
            {
              "name": "GCPay__CallbackBaseUrl",
              "valueFrom": {
                "secretKeyRef": {
                  "name": "tgs-connections",
                  "key": "payment-hpay-callback"
                }
              }
            },
            {
              "name": "GCPay__PaymentCode",
              "value": "HPay"
            }
          ]
        }
      EOF
  when: on_success

deploy-staging:
  extends: .deploy-template
  variables:
    namespace: staging
    kube_config: KubeConfig_Raypro_staging
  environment:
    name: staging
  stage: deploy-staging
  needs:
    - deploy-dev
    - job: push-k8s-template
      artifacts: true
  only:
    - main
  script:
    - deploy_k8s $TgsSettingKey $HelmTemplateFolderName $namespace
    - |
      cat << EOF | name_template="tgs-hpay" deploy_k8s $TgsSettingKey $HelmTemplateFolderName $namespace
        {
          "podServiceName": "Payment-HPay",
          "podEnv": [
            {
              "name": "ConnectionStrings__Nats",
              "valueFrom": {
                "secretKeyRef": {
                  "name": "tgs-connections",
                  "key": "nats"
                }
              }
            },
            {
              "name": "GCPay__PaymentApiUrl",
              "valueFrom": {
                "secretKeyRef": {
                  "name": "tgs-connections",
                  "key": "payment-hpay-paymentApiUrl"
                }
              }
            },
            {
              "name": "GCPay__CallbackBaseUrl",
              "valueFrom": {
                "secretKeyRef": {
                  "name": "tgs-connections",
                  "key": "payment-hpay-callback"
                }
              }
            },
            {
              "name": "GCPay__PaymentCode",
              "value": "HPay"
            }
          ]
        }
      EOF
  when: manual

deploy-prod:
  extends: .deploy-template
  variables:
    namespace: prod
    kube_config: KubeConfig_Raypro_prod
  environment:
    name: prod
  stage: deploy-prod
  needs:
    - deploy-staging
    - job: push-k8s-template
      artifacts: true
  only:
    - main
  script:
    - deploy_k8s $TgsSettingKey $HelmTemplateFolderName $namespace
    - |
      cat << EOF | name_template="tgs-hpay" deploy_k8s $TgsSettingKey $HelmTemplateFolderName $namespace
        {
          "podServiceName": "Payment-HPay",
          "podEnv": [
            {
              "name": "ConnectionStrings__Nats",
              "valueFrom": {
                "secretKeyRef": {
                  "name": "tgs-connections",
                  "key": "nats"
                }
              }
            },
            {
              "name": "GCPay__PaymentApiUrl",
              "valueFrom": {
                "secretKeyRef": {
                  "name": "tgs-connections",
                  "key": "payment-hpay-paymentApiUrl"
                }
              }
            },
            {
              "name": "GCPay__CallbackBaseUrl",
              "valueFrom": {
                "secretKeyRef": {
                  "name": "tgs-connections",
                  "key": "payment-hpay-callback"
                }
              }
            },
            {
              "name": "GCPay__PaymentCode",
              "value": "HPay"
            }
          ]
        }
      EOF
  when: manual
